name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig build test
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos; do
            zig build -Dtarget="$target" -p "dist/$target"
            case "$target" in
              x86_64-linux) asset=kite-linux-x86_64 ;;
              aarch64-linux) asset=kite-linux-aarch64 ;;
              x86_64-macos) asset=kite-macos-x86_64 ;;
              aarch64-macos) asset=kite-macos-aarch64 ;;
            esac
            cp "dist/$target/bin/kite" "release/$asset"
          done
      - run: scripts/check-size.sh release/kite-linux-x86_64
      - run: sha256sum release/* > release/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          generate_release_notes: true
