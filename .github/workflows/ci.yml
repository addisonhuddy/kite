name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check src build.zig
      - run: zig build
      - run: zig build test
      - run: scripts/cli-check.sh
      - run: scripts/install-quote-check.sh
      - run: scripts/install-pty-check.sh
      - run: scripts/check-size.sh
