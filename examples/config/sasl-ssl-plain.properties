# copy to ./kite.properties (or ~/.config/kite/kite.properties)
# Confluent Cloud style: API key/secret as SASL username/password.
bootstrap.servers=pkc-XXXXX.REGION.aws.confluent.cloud:9092
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.username=YOUR_API_KEY
sasl.password=YOUR_API_SECRET
# Optional: omit this line to use the system trust store.
# ssl.truststore.location=/etc/ssl/cert.pem
