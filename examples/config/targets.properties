# One file, several clusters: target.NAME.key defines key `key` for the
# cluster called NAME. Unprefixed keys are shared defaults that apply to
# every target. Select a cluster with --target NAME or $KITE_TARGET; the
# `target=` key below picks the default when neither is given.

# shared defaults
linger.ms=20
target=dev

target.dev.bootstrap.servers=localhost:9092

target.prod.bootstrap.servers=pkc-xyz.us-east-1.aws.confluent.cloud:9092
target.prod.security.protocol=SASL_SSL
target.prod.sasl.mechanism=PLAIN
target.prod.sasl.username=KEY
target.prod.sasl.password=SECRET
